services:
  app:
    build: .
    container_name: compose-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_FRONTEND_ORIGINS: ${FRONTEND_API}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: none
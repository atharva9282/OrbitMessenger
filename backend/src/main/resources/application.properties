spring.application.name=backend

# Railway provides MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER and MYSQLPASSWORD.
# Local development can continue using DB_USER and DB_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:chatMessenger}?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:}}}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Railway injects PORT. Local development defaults to 8080.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:strict}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Must match the browser origin used for the WebSocket handshake.
app.frontend-origins=${APP_FRONTEND_ORIGINS:http://localhost:3000}

server.error.include-message=never
server.error.include-stacktrace=never
